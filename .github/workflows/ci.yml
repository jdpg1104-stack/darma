name: CI

# Qué defiende este workflow, en orden de gravedad:
#   1. Que la economía de Darma no se desincronice entre TypeScript y Postgres.
#   2. Que la anon key no pueda leer ni escribir lo que no le toca (RLS).
#   3. Que ningún componente de cliente arrastre el cliente admin de Supabase.
#   4. Que el proyecto compile, pase lint y tenga los tests en verde.
#
# El orden importa: los guards baratos van primero para que un fallo de
# seguridad no espere a que termine un build de tres minutos.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # Un push nuevo cancela el CI del anterior en la misma rama: en un repo con
  # varias sesiones en paralelo, si no, se acumulan ejecuciones obsoletas que
  # tardan más y no informan de nada.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'

jobs:
  # ── 1. Guards de invariantes ────────────────────────────────────────────────
  # Segundos, sin base de datos y sin build. Si algo de aquí falla, el resto del
  # CI da igual: es un fallo de diseño, no de implementación.
  invariantes:
    name: Invariantes de seguridad y economía
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      # `npm install` y no `npm ci`, y conviene saber lo que eso cuesta.
      #
      # `npm ci` exige que el lockfile describa EXACTAMENTE el árbol a instalar.
      # Este proyecto se desarrolla en Windows y se construye en Linux, y npm
      # resuelve las dependencias OPCIONALES por plataforma: las variantes wasm
      # de `sharp` que Linux quiere (`@emnapi/*`) no son las que fija un lock
      # generado en Windows, ni siquiera en la misma versión. Resultado: `npm ci`
      # abortaba antes de ejecutar una sola comprobación y los CUATRO trabajos
      # salían en rojo por un motivo que no tenía nada que ver con el código.
      #
      # Lo que se pierde: `npm install` puede resolver una versión más nueva que
      # la del lock si el rango lo permite, así que la reproducibilidad exacta ya
      # no está garantizada. Es un precio real y se paga a sabiendas: un CI que
      # no arranca no protege nada.
      #
      # Cómo recuperarlo el día que haga falta: generar el lockfile en Linux
      # (contenedor o el propio runner) y volver a `npm ci`.
      - run: npm install --no-audit --no-fund

      # Los pesos del karma, el tope diario, los niveles, la regla 3:1 y la
      # fórmula del hot score existen en dos sitios (lib/*.ts y las migraciones).
      # Este guard es lo único que impide que se separen en silencio — y que se
      # separen significa que a alguien deja de contarle el karma que ganó.
      - name: Economía · TypeScript ≡ SQL
        run: node --test --experimental-strip-types "lib/economySync.test.ts"

      # Una sola importación transitiva del cliente admin desde un árbol con
      # 'use client' pone la service_role key en el bundle del navegador. Eso no
      # es un bug con consecuencias: es la app entera abierta.
      - name: El cliente admin no llega al navegador
        run: node --test --experimental-strip-types "scripts/security/guardClienteAdmin.test.ts"

      - name: Guards de seguridad restantes
        run: node --test --experimental-strip-types "scripts/security/*.test.ts"

      # INFORMATIVO A PROPÓSITO, y conviene entender por qué no falla.
      #
      # Los 24 teléfonos van a estar sin verificar durante semanas: confirmarlos
      # exige hablar con cada organización. Un job que fallara dejaría `main` en
      # rojo permanente, y un CI siempre rojo enseña a fusionar por encima de él
      # — el día que se rompa algo de verdad, nadie lo mira.
      #
      # El freno REAL está en `prebuild`, que corre antes de `next build`: Vercel
      # construye con `npm run build` y solo despliega `main`, así que el
      # despliegue a producción se detiene ahí mientras quede un número sin
      # confirmar. Aquí solo se deja el recuento a la vista en cada PR.
      - name: Teléfonos de crisis · cuántos faltan
        run: node --experimental-strip-types scripts/security/gateTelefonos.ts

  # ── 2. Calidad estática ─────────────────────────────────────────────────────
  calidad:
    name: Tipos, lint y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund

      # --incremental false: el .tsbuildinfo cacheado de otra rama puede dar un
      # verde falso.
      - name: Tipos
        run: npx tsc --noEmit --incremental false

      # --max-warnings 0 NO se activa todavía: hay avisos conocidos y
      # justificados (los scripts de k6 exigen un export default anónimo). Se
      # sube cuando estén acotados por override en eslint.config.mjs.
      - name: Lint
        run: npx eslint .

      - name: Pruebas unitarias
        run: >
          node --test --experimental-strip-types
          "lib/**/*.test.ts" "i18n/*.test.ts"
          "scripts/**/*.test.ts" "components/**/*.test.ts"

      - name: Build
        run: npm run build
        env:
          # Valores de relleno: el build no habla con Supabase, pero next.config
          # deriva de aquí el origen de la CSP y con la variable vacía la
          # cabecera saldría distinta a la de producción.
          NEXT_PUBLIC_SUPABASE_URL: https://ejemplo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  # ── 3. RLS contra un Postgres de verdad ─────────────────────────────────────
  # La única forma honesta de probar una política de RLS es intentar saltársela
  # con la anon key contra una base real. Un mock de PostgREST prueba el mock.
  rls:
    name: Políticas RLS (Postgres real)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Levantar Supabase local
        run: supabase start

      - name: Aplicar migraciones
        run: supabase db reset --no-seed

      # Cada caso afirma que una operación PROHIBIDA falla. Un test de RLS que
      # solo comprueba el camino permitido pasa igual con RLS desactivada, que
      # es exactamente el fallo que no queremos que se cuele.
      - name: Suite de RLS
        run: node --test --experimental-strip-types "supabase/tests/rls.integracion.ts"

      # Los tipos se GENERAN, no se escriben: si el esquema cambió y nadie
      # regeneró, el diff lo destapa aquí en vez de en producción.
      #
      # Se compara SOLO el esquema `public` y se recorta el bloque
      # `__InternalSupabase`. No es para que el guard pase más fácil: es que esos
      # dos trozos los decide el GENERADOR y no el esquema. El del panel remoto
      # emite `__InternalSupabase` con la versión de PostgREST y omite
      # `graphql_public`; el CLI local hace justo lo contrario. Comparados en
      # crudo no coinciden nunca, y un guard que falla siempre por algo ajeno al
      # esquema acaba desactivado — que es lo contrario de lo que se busca.
      #
      # Lo que sigue vigilando, que es lo que importa: cualquier tabla, columna,
      # función o enum de `public` que exista en las migraciones y no esté en el
      # archivo versionado.
      - name: database.types.ts está al día
        run: |
          # Se van también las dos líneas de comentario que el generador remoto
          # pone encima del bloque, y todas las líneas en blanco: ninguna de las
          # dos cosas dice nada del esquema, y la comparación es más robusta sin
          # ellas.
          recortar() {
            sed -e '/__InternalSupabase: {/,/^  }$/d'                 -e '/Allows to automatically instantiate createClient/d'                 -e '/instead of createClient<Database/d' "$1"               | sed '/^[[:space:]]*$/d'
          }
          supabase gen types typescript --local --schema public > /tmp/tipos.ts
          diff -u <(recortar lib/supabase/database.types.ts) <(recortar /tmp/tipos.ts) \
            || { echo "::error::database.types.ts desactualizado. Regenera con: npx supabase gen types typescript --local --schema public > lib/supabase/database.types.ts"; exit 1; }

  # ── 4. Higiene de secretos y dependencias ───────────────────────────────────
  secretos:
    name: Secretos y dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Historial completo: un secreto que se coló y se "borró" en el commit
          # siguiente sigue estando en el repositorio para siempre.
          fetch-depth: 0

      - name: Escaneo de secretos
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm install --no-audit --no-fund
      # `--omit=optional` deja fuera a `sharp`, que Next declara como opcional para
      # optimizar imágenes. Sus avisos son CVE heredados de libvips y npm no
      # ofrece arreglo: propone «bajar Next a la versión 9». Forzarlo con
      # `overrides` tampoco vale — sus paquetes wasm son distintos por
      # plataforma, y un lockfile generado en Windows deja de servir para
      # `npm ci` en Linux, que fue exactamente lo que tumbó los cuatro trabajos.
      #
      # Lo que NO se hace es subir el umbral a `critical`: eso escondería
      # cualquier vulnerabilidad alta futura en una dependencia de verdad. Aquí
      # se excluye una dependencia concreta y opcional, y queda escrito por qué.
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high --omit=optional
